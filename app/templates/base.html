<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}BuySellChain{% endblock %}</title>

		<script defer src="static/js/nav.js"></script>
		{% block scripts %}
		{% endblock %}

		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"
		/>

		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
	</head>
	<body>
		<nav class="container-fluid" x-data="navHandler">
			<ul>
				<li><strong>BuySellChain</strong></li>
			</ul>
			<ul>
				<li><a href="/">Home</a></li>

				<template x-if="!isLoggedIn">
					<li><a href="/login" role="button">Login</a></li>
				</template>
				<template x-if="!isLoggedIn">
					<li><a href="/signin" role="button">Signin</a></li>
				</template>

				<template x-if="isLoggedIn">
					<li><a href="/profile">Profilo</a></li>
				</template>
				<template x-if="isLoggedIn">
					<li>
						<a href="#" @click="logout()" class="secondary"
							>Logout</a
						>
					</li>
				</template>
			</ul>
		</nav>

		<main class="container">{% block content %}{% endblock %}</main>
	</body>
</html>
